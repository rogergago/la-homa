.tour-card p{margin:0;color:#6c5e7d;font-size:15px;line-height:1.5}
.tour-progress{display:flex;gap:6px;margin:0 0 14px}.tour-progress span{flex:1;height:4px;border-radius:99px;background:#e6e0ef}.tour-progress span.on{background:var(--purple)}
.tour-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media(max-width:850px){.tour-layer{bottom:90px}}

@media(max-width:580px){.topbar>div:first-child{flex:1;min-width:0;max-width:none}.topbar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:.7px}.topbar>.flex{flex-shrink:0;gap:5px}.topbar>.icon-btn{display:none}.topbar .notification-button{min-width:36px;width:36px}.topbar .mode-btn{white-space:nowrap}.topbar-date{white-space:nowrap}}

  function normalize(code) {
    const c = String(code || '').toLowerCase();
    if (codes.has(c)) return c;
    if (c.startsWith('ca-valencia') || c === 'ca-valencia') return 'va';
    const short = c.split('-')[0];
    return codes.has(short) ? short : 'es';
  }

  function detect() {
    try {
      const stored = localStorage.getItem(STORAGE);
      if (stored) return normalize(stored);
    } catch (_) {}
    try {
      const nav = (navigator.languages || [navigator.language || 'es']).map(x => String(x).toLowerCase());
      for (const item of nav) {
        if (item.startsWith('ca') && (item.includes('valencia') || item.includes('vc'))) return 'va';
        const n = normalize(item);
        if (n !== 'es' || item.startsWith('es')) return n === 'es' && !item.startsWith('es') ? normalize(item) : n;
      }
      for (const item of nav) {
        const n = normalize(item);
        if (codes.has(n)) return n;
      }
    } catch (_) {}
    return 'es';
  }

  let current = 'es';
  try { current = detect(); } catch (_) { current = 'es'; }

  function setLocale(code, persist = true) {
    current = normalize(code);
    if (persist) {
      try { localStorage.setItem(STORAGE, current); } catch (_) {}
    }
    try { document.documentElement.lang = current === 'va' ? 'ca' : current; } catch (_) {}
    return current;
  }

  function t(key, vars) {
    const table = dict[current] || es;
    let text = table[key] ?? es[key] ?? key;
    if (vars) for (const [k, v] of Object.entries(vars)) text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), String(v));
    return text;
  }

  function bcp() {
    return (LOCALES.find(l => l.code === current) || LOCALES[0]).bcp;
  }

  function langOptions(selected) {
    const sel = normalize(selected || current);
    return LOCALES.map(l => `<option value="${l.code}" ${l.code === sel ? 'selected' : ''}>${l.native}</option>`).join('');
  }

  setLocale(current, false);

  return { LOCALES, STORAGE, normalize, detect, setLocale, getLocale: () => current, t, bcp, langOptions, dict };

function renderHome(){

ber="${m.id}"`)}${isAdult()?`<div class="mt">${btn('Ajustar puntos','adjust-form',`data-member="${m.id}" data-week="${w.id}"`,'secondary wide','edit')}</div>`:''}${w.adjustments.some(a=>a.memberId===m.id)?`<div class="panel mt"><div class="panel-header"><h3>Ajustes registrados</h3></div><div class="panel-body">${w.adjustments.filter(a=>a.memberId===m.id).map(a=>`<div class="audit-row"><div class="grow"><b>${esc(a.reason)}</b><p>${new Date(a.createdAt).toLocaleDateString('es-ES')}</p></div><b class="${a.points>0?'green':'danger'}">${signed(a.points)}</b>${isAdult()&&!a.reversed&&!a.reversesId?iconBtn('trash','adjust-delete','Anular ajuste',`data-id="${a.id}" data-week="${w.id}"`):''}</div>`).join('')}</div></div>`:''}</section></div>`;}

function isMasterAccount(){if(access.mode!=='cloud')return true;return !!(access.membership?.isOwner||access.membership?.role==='owner');}
function isChildAccount(){return access.mode==='cloud'&&access.membership?.role==='child';}
function canSwitchProfiles(){if(isChildAccount())return false;if(isMasterAccount())return true;return !!state.settings.allowAdultsSwitchProfiles;}
function canManageInvites(){return isAdult()&&!isChildAccount()&&(access.mode!=='cloud'||access.membership?.role==='owner'||access.membership?.role==='adult');}
function linkedMemberId(){return access.membership?.linkedMemberId||null;}
function inviteMailto(email,code,personName){
  const subject=encodeURIComponent('Invitación a La Homa'+(personName?' · '+personName:''));
  const body=encodeURIComponent('Te han invitado a la familia en La Homa.\n\n1. Abre https://app.lahoma.app\n2. Crea tu cuenta con este mismo correo ('+email+')\n3. En el registro, escribe este código: '+code+'\n\nEl código caduca en 7 días y solo sirve una vez.');
  return 'mailto:'+encodeURIComponent(email)+'?subject='+subject+'&body='+body;
}
function showInviteResult(inv,personName){
  const code=inv.code||inv;
  const email=inv.email||'';
  const roleLabel=inv.role==='child'?'niño o niña':'adulto';
  const mail=email?`<p class="mt"><a class="btn secondary wide" href="${inviteMailto(email,code,personName)}">Abrir correo para invitar</a></p>`:'';
  openModal('Invitación lista',`<p class="dialog-description">Comparte este código con la persona invitada (${esc(roleLabel)}). Debe crear su cuenta en La Homa${email?' con <b>'+esc(email)+'</b>':''} y pegar el código al registrarse. Caduca en 7 días.</p><p style="font-size:1.5rem;letter-spacing:.14em;font-weight:700">${esc(code)}</p>${mail}${footer('Entendido')}`,()=>true);
}
async function inviteMemberByEmail(memberId){
  if(!canManageInvites()||access.mode!=='cloud')throw new Error('Las invitaciones por correo necesitan la cuenta en la nube.');
  const m=state.members.find(x=>x.id===memberId);if(!m||m.role==='pet')throw new Error('Elige un adulto o un niño.');
  const email=String(m.email||'').trim().toLowerCase();if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Añade un correo válido a esta persona antes de invitar.');
  const role=m.role==='adult'?'adult':'child';
  const inv=await window.HomaCloudTransport.invite(email,m.id,role);
  transact(s=>{const x=s.members.find(y=>y.id===m.id);if(x){x.email=email;x.inviteStatus='pending';}},null);
  showInviteResult(inv,m.name);
}

function setActor(role,mid=null){if(isChildAccount()){role='member';mid=linkedMemberId()||mid||actor.memberId;}if(role==='adult'&&!canSwitchProfiles()&&!isMasterAccount()&&access.membership?.role==='adult'){/* other adults may enter adult mode for their admin work */}if(role==='adult')ui.kitchenActive=false;if(role==='member'&&mid&&!canSwitchProfiles()&&linkedMemberId()&&mid!==linkedMemberId()&&!isMasterAccount()){toast('No puedes entrar en el perfil de otra persona.',true);return;}actor={role,memberId:mid};try{sessionStorage.setItem(KEY+'-profile',JSON.stringify(actor));}catch(_){}ui.taskPerson='all';ui.taskTab='assignments';ui.rewardTab='week';ui.selectedWeek=current().id;ui.view=role==='adult'?'home':'member';ui.memberId=mid;ui.profileWeek=current().id;closeModal();render();}
async function pinHash(pin,salt=null){if(!crypto?.subtle)throw new Error('Este navegador no permite configurar el PIN aquí. Abre la app en Chrome o mediante HTTPS/localhost.');const bytes=salt?Uint8Array.from(salt.match(/../g),x=>parseInt(x,16)):crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes,iterations:100000,hash:'SHA-256'},key,256);const hex=a=>[...a].map(n=>n.toString(16).padStart(2,'0')).join('');return{salt:hex(bytes),hash:hex(new Uint8Array(bits))};}
function adultLogin(){if(isChildAccount()){toast('Esta cuenta es de un niño: solo puede ver su propio espacio.',true);return;}if(!state.settings.pin){setActor('adult');return;}openModal('La llave de los adultos',`${field('PIN de seis números','pin','','password','required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off"')}<div class="note">Este PIN protege el cambio de perfil en este dispositivo. No es una cuenta en la nube.</div>${footer('Entrar al modo adulto')}`,async fd=>{if(Date.now()<pinLockUntil)throw new Error('Se han hecho varios intentos. Prueba de nuevo dentro de 30 segundos.');const hash=await pinHash(fd.get('pin'),state.settings.pin.salt);if(hash.hash!==state.settings.pin.hash){pinAttempts++;if(pinAttempts>=5){pinLockUntil=Date.now()+30000;pinAttempts=0;}throw new Error('Ese PIN no coincide.');}pinAttempts=0;setActor('adult');return true;});}
function pinForm(){if(!needAdult())return;openModal(state.settings.pin?'Cambiar PIN de adulto':'Proteger el modo adulto',`${field('Nuevo PIN (seis números)','pin','','password','required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="new-password"')}${field('Repite el PIN','confirm','','password','required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="new-password"')}<div class="note warning">Guardalo en un lugar seguro. No hay recuperación por correo porque no existen cuentas. El PIN es un control local y puede eludirse con acceso técnico al navegador.</div>${footer('Guardar PIN',state.settings.pin?btn('Quitar PIN','pin-remove','','danger','lock'):'')}`,async fd=>{if(fd.get('pin')!==fd.get('confirm'))throw new Error('Los dos PIN deben coincidir.');if(!/^\d{6}$/.test(fd.get('pin')))throw new Error('El PIN debe tener seis números.');const pin=await pinHash(fd.get('pin'));return transact(s=>{s.settings.pin=pin;},'PIN activado.');});}
function onboarding(){if(!needAdult())return;openModal('Esta vez, vuestra propia familia.',`<p class="dialog-description">Todo listo para empezar hoy, sin misiones atrasadas. Después podrás añadir más personas y adaptar cada detalle.</p>${field('Como se llama vuestro equipo?','familyName','','text','required maxlength="80" placeholder="Familia Garcia"')}${field('Nombre de un adulto','adultName','','text','required maxlength="80" placeholder="Tu nombre"')}<div class="form-grid">${field('Otro miembro (opcional)','member1','','text','maxlength="80" placeholder="Nombre"')}${field('Otro miembro (opcional)','member2','','text','maxlength="80" placeholder="Nombre"')}</div><div class="mt">${field('PIN adulto, opcional (6 números)','pin','','password','inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="new-password"')}</div><label class="check-label"><input name="starterTasks" type="checkbox" checked>Crear dos misiones sencillas para empezar.</label><label class="check-label"><input name="starterRecipes" type="checkbox" checked>Conservar las recetas de inicio.</label><label class="check-label align-top"><input name="replace" type="checkbox" required><span>Entiendo que se sustituirán los datos actuales. Antes se descargará una copia de seguridad.</span></label>${footer('Crear nuestro hogar')}`,async fd=>{const name=String(fd.get('familyName')).trim(),adult=String(fd.get('adultName')).trim();if(!name||!adult)throw new Error('Escribe el nombre de la familia y de un adulto.');const pin=fd.get('pin')?await pinHash(fd.get('pin')):null;const next=C.seed();next.demo=false;next.settings={familyName:name,teamTarget:0,teamReward:'Un plan especial todos juntos',closePending:true,pin};next.members=[{id:C.uid('member'),name:adult,avatar:'\u{1F33C}',color:colors[2],role:'adult',age:null,active:true}];for(const [i,k] of ['member1','member2'].entries()){const n=String(fd.get(k)).trim();if(n)next.members.push({id:C.uid('member'),name:n,avatar:avatars[i],color:colors[i],role:'member',age:null,active:true});}next.templates=[];if(fd.get('starterTasks'))next.templates=[{id:C.uid('task'),title:'Ordenar nuestro espacio',description:'Dejar nuestras cosas en su sitio.',points:2,memberIds:next.members.map(m=>m.id),days:[0,1,2,3,4,5,6],frequency:'daily',category:'Casa',icon:'house',active:true},{id:C.uid('task'),title:'Ayudar a preparar la mesa',description:'Preparar la mesa entre todos.',points:5,memberIds:next.members.map(m=>m.id),days:[6],frequency:'weekly',category:'Cocina',icon:'utensils',active:true}];next.rewards=next.members.map(m=>({id:C.uid('reward'),memberId:m.id,title:'Elegir un plan en familia',description:'Una idea especial para disfrutar juntos.',icon:'\u{1F381}',mode:'weekly',threshold:null,active:true}));C.resetV2(next);next.weeks=[];next.events=[];next.shopping=[];next.mealPlan=[];if(!fd.get('starterRecipes'))next.recipes=[];const w=C.generateWeek(next,C.monday());w.tasks=w.tasks.filter(t=>t.date>=C.iso());C.validateState(next);downloadFile('la-homa-antes-de-empezar-'+C.iso()+'.json',JSON.stringify(state,null,2),'application/json');const ok=transact(()=>{state=next;},'Vuestro hogar está listo. Bienvenidos!');if(ok){actor={role:'adult',memberId:null};try{sessionStorage.removeItem(KEY+'-profile');}catch(_){}ui.view='home';ui.selectedWeek=current().id;render();}return ok;});}

function taskSet(wid,id,status){const w=getWeek(wid),t=w.tasks.find(t=>t.id===id);if(!t)return;const before=t.status,previousUnlock=new Set(w.rewards.filter(r=>C.rewardState(w,r).unlocked).map(r=>r.id));let delta=0;const ok=transact(()=>{delta=C.setStatus(getWeek(wid),id,status,actor);});if(!ok)return;closeModal();if(delta===0&&before===status){toast('Esta misión ya tenia ese estado. No se duplican puntos.');return;}const actual=getWeek(wid).tasks.find(t=>t.id===id).status;const undo=(isAdult()||!['missed','review','excused'].includes(before))?()=>taskSet(wid,id,before):null;toast(actual==='review'?'Enviada a revisar. A\u00fan no suma puntos.':actual==='excused'?'Tarea justificada. Se ha recalculado el reparto de puntos.':status==='done'?`Misión realizada. ${signed(delta)} puntos.`:status==='missed'?`Misión no realizada. ${signed(delta)} puntos.`:`De nuevo pendiente. ${signed(delta)} puntos.`,false,undo);const now=getWeek(wid);const unlocked=now.rewards.find(r=>r.memberId===t.memberId&&C.rewardState(now,r).unlocked&&!previousUnlock.has(r.id));if(unlocked)celebrate(`${member(t.memberId,now).name}, ¡Recompensa desbloqueada!`);}
function taskStateModal(wid,id){const w=getWeek(wid),t=w.tasks.find(t=>t.id===id);if(!t)return;if(!isAdult()&&!C.taskPermission(w,t,actor,C.iso()).allowed){toast(C.taskPermission(w,t,actor,C.iso()).reason,true);return;}const opts=[['done','Realizada',!isAdult()&&t.requiresReview?'Se envía a revisar. Suma puntos cuando un adulto la aprueba.':'Suma '+C.taskPoints(w,t)+' puntos.','check'],['pending','Pendiente','No suma ni resta puntos.','clock'],...(isAdult()?[['missed','No realizada','Resta '+C.taskPoints(w,t)+' puntos.','close'],['excused','Justificada','No suma, no resta y no cuenta en el objetivo.','minus']]:[])];openModal(esc(t.title),`<p class="dialog-description">${esc(member(t.memberId,w).name)} &middot; ${esc(dateLabel(t.date,{weekday:'long',day:'numeric',month:'long'}))}</p>${opts.map(([v,label,note,ic])=>`<button type="button" class="status-option ${t.status===v?'selected':''}" data-action="task-set" data-id="${id}" data-week="${wid}" data-status="${v}">${icon(ic)}<div><h3>${label}</h3><p>${note}</p></div></button>`).join('')}<div class="note mt">Cambiar de estado recalcula la puntuación. Una tarea no puede contar dos veces.</div>`);}

function legacyRenderDues(m){const dues=state.finance.dues.filter(d=>d.memberId===m.id&&d.status==='pending');if(!dues.length)return '';return `<div class="panel mt"><div class="panel-header"><h3>Pagas pendientes de confirmar</h3><span class="pill coral">${dues.length}</span></div>${dues.slice(-52).map(d=>`<div class="settings-row padded"><div class="grow"><h4>${euro(d.cents)} &middot; ${esc(dateLabel(d.date))}</h4><p>${d.savePercent}% a la hucha &middot; ${d.policy==='goal'?'Condicionada al objetivo de esa semana':'Paga fija'}.</p></div>${isAdult()?btn('Confirmar abono','v2-pay',vattr(d.id),'primary small'):'<span class="small muted">Lo confirma un adulto</span>'}</div>`).join('')}</div>`;}
function renderSpendRequests(m){const list=state.finance.requests.filter(r=>r.memberId===m.id&&r.status==='pending');if(!list.length)return '';return `<div class="panel mt"><div class="panel-header"><h3>Gastos por conversar</h3><span class="small muted">A\u00fan no se ha descontado dinero.</span></div>${list.map(r=>`<div class="settings-row padded"><div class="grow"><h4>${esc(r.note)}</h4><p>${euro(r.cents)} &middot; ${esc(pocketLabel(r.pocket))}</p></div>${isAdult()?`<div class="flex">${btn('Confirmar','v2-spend-approve',vattr(r.id),'primary small')}${iconBtn('close','v2-spend-decline','No aprobar',vattr(r.id))}</div>`:'<span class="pill coral">Pendiente</span>'}</div>`).join('')}</div>`;}
function renderMoneyActivity(m){const entries=state.finance.ledger.filter(e=>e.memberId===m.id).slice().reverse();return `${renderSpendRequests(m)}${renderDues(m)}<div class="panel mt"><div class="panel-header"><h3>Todo tiene su historia.</h3><span class="small muted">${entries.length} movimientos</span></div>${entries.length?entries.map(e=>{const net=Object.values(e.delta).reduce((n,x)=>n+x,0),reversed=state.finance.ledger.some(x=>x.ref==='reverse:'+e.id);return `<div class="money-entry"><span class="entry-icon">${icon(e.type==='transfer'?'swap':net>=0?'plus':'bag')}</span><div class="grow"><h4>${esc(e.note)}</h4><p class="small muted">${esc(new Date(e.at).toLocaleString(localeBcp(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))} ${reversed?'&middot; corregido con otro asiento':''}</p><p class="tiny muted">${Object.entries(e.delta).filter(([,n])=>n!==0).map(([p,n])=>`${esc(pocketLabel(p))}: ${n>0?'+':''}${euro(n)}`).join(' &middot; ')}</p></div><b class="${net<0?'danger':'green'}">${net===0?'Reparto':(net>0?'+':'')+euro(net)}</b>${isAdult()&&!['reversal','interest'].includes(e.type)&&!reversed?iconBtn('history','v2-money-reverse','Corregir movimiento',vattr(e.id)):''}</div>`;}).join(''):empty(esc(t('emptyLedgerTitle')),esc(t('emptyLedgerDetail')))}</div><div class="note mt">Las correcciones crean un asiento contrario; no borran la historia. Anular un abono semanal no lo vuelve a programar: para reponerlo, registra un ingreso con su motivo.</div>`;}
function legacyMoneyConfig(mid){if(!needAdult())return;const a=state.finance.accounts.find(a=>a.memberId===mid)||{weeklyCents:300,payDay:6,savePercent:50,policy:'fixed',enabled:true};openModal('La paga de '+esc(member(mid).name),`<div class="note mb">T\u00fa decides el importe. Estos valores iniciales son un ejemplo, no una recomendaci\u00f3n por edad. Se registra dinero que custodia la familia; no hay pagos bancarios.</div><div class="form-grid">${field('Paga semanal (\u20ac)','amount',(a.weeklyCents/100).toFixed(2),'number','required min="0.01" max="1000" step="0.01"')}<label class="field"><span>D\u00eda de paga</span><select name="day">${days().map((d,i)=>`<option value="${i}" ${a.payDay===i?'selected':''}>${d}</option>`).join('')}</select></label></div><label class="field mt"><span>Regla familiar</span><select name="policy"><option value="fixed" ${a.policy==='fixed'?'selected':''}>Fija, independiente de los puntos</option><option value="goal" ${a.policy==='goal'?'selected':''}>Al alcanzar el objetivo de puntos de esa semana</option></select></label>${field('Porcentaje inicial para ahorrar','savePercent',a.savePercent,'number','required min="0" max="100" step="1"','El resto queda disponible. Despu\u00e9s podr\u00e1is repartirlo de nuevo.')}<label class="check-label"><input type="checkbox" name="enabled" ${a.enabled?'checked':''}>Paga activa</label><div class="note warning mt">Los abonos ya previstos conservan su importe y regla. Los cambios se aplican a los que se generen despu\u00e9s. No hay descuentos autom\u00e1ticos de dinero ni pagos duplicados.</div>${footer('Guardar paga')}`,fd=>transact(s=>C.configureAllowance(s,{memberId:mid,weeklyCents:C.moneyCents(fd.get('amount')),payDay:Number(fd.get('day')),savePercent:Number(fd.get('savePercent')),policy:fd.get('policy'),enabled:!!fd.get('enabled')},actor),'Paga configurada.'));}
function transferForm(mid,to='savings'){C.ownOrAdult?.(actor,mid);if(!isAdult()&&actor.memberId!==mid)return;openModal('Un sitio para cada euro',`<div class="note mb">Repartir no suma ni resta dinero: solo cambia d\u00f3nde lo guardas.</div><label class="field"><span>Desde</span><select name="from">${pocketOptions(mid,'available')}</select></label><label class="field"><span>Hacia</span><select name="to">${pocketOptions(mid,to)}</select></label>${field('Cu\u00e1nto (\u20ac)','amount','','number','required min="0.01" step="0.01" placeholder="1,00"')}${footer('Guardar este reparto')}`,fd=>transact(s=>C.transferMoney(s,mid,fd.get('from'),fd.get('to'),C.moneyCents(fd.get('amount')),actor),'Dinero repartido. El total sigue siendo el mismo.'));}
function spendForm(mid,goal=null){if(!isAdult()&&actor.memberId!==mid)return;const pocket=goal?'goal:'+goal.id:'available';openModal(goal?'Disfrutar mi objetivo':'Pensamos este gasto',`<div class="note mb">${isAdult()?'Confirma solo gastos reales o entregas de efectivo.':'Un adulto revisar\u00e1 esta petici\u00f3n.'} El saldo se descuenta al confirmar, no al pedir. Las solicitudes no reservan dinero.</div>${field('Para qu\u00e9','note',goal?.title||'','text','required maxlength="300" placeholder="Por ejemplo, un libro"')}${field('Importe (\u20ac)','amount',goal?(goal.targetCents/100).toFixed(2):'','number','required min="0.01" step="0.01"')}<label class="field"><span>De qu\u00e9 bolsillo</span><select name="pocket" ${goal?'disabled':''}>${pocketOptions(mid,pocket)}</select></label>${footer(isAdult()?'Confirmar gasto':'Pedir permiso')}`,fd=>transact(s=>{const r=C.requestSpend(s,{memberId:mid,pocket:goal?pocket:fd.get('pocket'),cents:C.moneyCents(fd.get('amount')),note:String(fd.get('note')).trim(),finishGoal:!!goal},actor);if(isAdult())C.resolveSpend(s,r.id,true,actor);},isAdult()?'Gasto registrado.':'Petici\u00f3n enviada al adulto.'));}
function goalForm(mid){if(!isAdult()&&actor.memberId!==mid)return;openModal('Algo por lo que ahorrar',`${field('Mi objetivo','title','','text','required maxlength="100" placeholder="Mi primera bicicleta"')}<div class="form-grid">${field('Precio (\u20ac)','amount','','number','required min="0.01" step="0.01"')}${field('Un icono','icon','\u{1F381}','text','required maxlength="20"')}</div><div class="note mt">Puedes cambiar de idea: desde Repartir mi dinero podr\u00e1s mover lo guardado de vuelta a la hucha.</div>${footer('Crear objetivo')}`,fd=>transact(s=>C.addGoal(s,{memberId:mid,title:String(fd.get('title')).trim(),targetCents:C.moneyCents(fd.get('amount')),icon:String(fd.get('icon')).trim()},actor),'Ya tienes un objetivo para ahorrar.'));}
function renderRoutines(){const visible=state.routines.filter(r=>r.active!==false&&(isAdult()?(ui.routineMember==='all'||r.memberId===ui.routineMember):r.memberId===actor.memberId));return `${heading(esc(t('routinesTitle')), esc(t('routinesSub')),isAdult()?btn(esc(t('create')),'v2-routine-form','','primary','plus'):'')}${isAdult()?personChoices(ui.routineMember,'routine',activeMembers(),true):''}<div class="routine-grid">${visible.map(r=>{const ts=C.routineTasks(state,r),done=ts.filter(t=>['done','excused'].includes(t.status)).length;return `<article class="routine-card"><div class="flex between"><span class="routine-symbol">${esc(r.icon)}</span>${isAdult()?iconBtn('edit','v2-routine-form','Editar rutina',vattr(r.id)):''}</div><div class="flex mt">${avatar(member(r.memberId),'small')}<span class="small muted">${esc(member(r.memberId).name)}</span></div><h2>${esc(r.title)}</h2><p class="small muted">${ts.length?`${done} de ${ts.length} pasos resueltos hoy`:'Estos pasos no est\u00e1n asignados para hoy.'}</p><div class="mt">${progress(ts.length?Math.round(done/ts.length*100):0)}</div><div class="mt">${btn(ts.length&&done===ts.length?'Ver mi rutina':'Empezar paso a paso','v2-routine-run',vattr(r.id),'primary wide','arrow')}</div></article>`;}).join('')||empty(esc(t('emptyRoutinesTitle')),esc(t('emptyRoutinesDetail')),isAdult()?'v2-routine-form':'', t('create'))}</div><div class="note mt">Los pasos se conectan con las tareas de hoy. Marcar un paso aqu\u00ed actualiza esa misma tarea en Misiones. Un paso enviado a revisar no da puntos hasta que lo aprueba un adulto.</div>`;}
function routineForm(id){if(!needAdult())return;const r=state.routines.find(r=>r.id===id),mid=r?.memberId||moneyPeople()[0]?.id||activeMembers()[0].id;openModal(r?'Editar rutina':'Preparar una rutina',`${field('Nombre de la rutina','title',r?.title||'Buenos d\u00edas','text','required maxlength="100"')}<div class="form-grid"><label class="field"><span>Persona</span><select name="memberId" data-change="v2-routine-owner">${activeMembers().filter(m=>m.role!=='pet').map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>${field('Icono','icon',r?.icon||'\u2600\uFE0F','text','required maxlength="20"')}</div><div class="field mt"><span>Misiones de esta persona, en orden</span><div id="routine-choices">${routineChecks(mid,r?.templateIds||[])}</div><small>Se mostrar\u00e1n solo las que correspondan a cada d\u00eda. El orden es el del listado.</small></div>${footer('Guardar rutina',r?btn('Eliminar','v2-routine-delete',vattr(r.id),'danger'): '')}`,fd=>{const ids=fd.getAll('templates');if(!ids.length)throw new Error('Selecciona al menos una misi\u00f3n.');return transact(s=>{const val={id:r?.id||C.uid('routine'),title:String(fd.get('title')).trim(),icon:String(fd.get('icon')).trim(),memberId:fd.get('memberId'),templateIds:ids,active:true};const old=s.routines.find(x=>x.id===val.id);if(old)Object.assign(old,val);else s.routines.push(val);},'Rutina guardada.');});}
function routineChecks(mid,ids){return state.templates.filter(t=>t.active!==false&&t.memberIds.includes(mid)).map(t=>`<label class="check-label"><input type="checkbox" name="templates" value="${esc(t.id)}" ${ids.includes(t.id)?'checked':''}>${esc(t.title)}</label>`).join('')||'<p class="muted small">Asigna primero una misi\u00f3n a esta persona.</p>';}
function routineRun(id){const r=state.routines.find(r=>r.id===id);if(!r||(!isAdult()&&r.memberId!==actor.memberId))return;const ts=C.routineTasks(state,r),step=ts.find(t=>!['done','excused','review'].includes(t.status)),waiting=ts.filter(t=>t.status==='review').length,done=ts.filter(t=>['done','excused'].includes(t.status)).length;openModal(esc(r.title),`<div class="routine-run"><span class="routine-symbol">${esc(r.icon)}</span><div class="small muted">${esc(member(r.memberId).name)} &middot; ${esc(dateLabel(C.iso()))}</div>${step?`<p class="eyebrow mt">PASO ${ts.indexOf(step)+1} DE ${ts.length}</p><h2>${esc(step.title)}</h2><p class="muted">${esc(step.description||'A tu ritmo. Cuando est\u00e9 listo, pulsa aqu\u00ed.')}</p><div class="mt">${btn(step.requiresReview&&!isAdult()?'Listo, enviar a revisar':'\u00a1Hecho!','v2-routine-step',`${vattr(step.id)} data-routine="${r.id}" data-week="${C.monday()}"`,'primary wide','check')}</div>`:`<h2>${waiting?'Listo para revisar':ts.length?'\u00a1Rutina completada!':'Hoy no hay pasos asignados'}</h2><p class="muted">${waiting?`${waiting} paso${waiting===1?'':'s'} pendiente${waiting===1?'':'s'} de un adulto.`:ts.length?'Un peque\u00f1o paso, un d\u00eda m\u00e1s f\u00e1cil.':'Puedes consultar tus otras misiones de hoy.'}</p>`}<div class="routine-dots">${ts.map(t=>`<span class="${['done','excused'].includes(t.status)?'done':t.status==='review'?'review':''}" title="${esc(t.title)}">${t.status==='done'?'\u2713':t.status==='review'?'\u23f3':'\u2022'}</span>`).join('')}</div><div class="small muted">${done} resueltos de ${ts.length}. Los mismos puntos, sin duplicados.</div></div>`);}
function legacyRenderOrganize(){const w=current(),review=w.tasks.filter(t=>t.status==='review'),swaps=state.swaps.filter(x=>isAdult()||[x.from,x.to].includes(actor.memberId));return `${heading(esc(t('organizeTitle')), esc(t('organizeSub')),isAdult()?btn('Justificar ausencia','v2-absence-form','','secondary','calendar'):'')}${isAdult()&&review.length?`<div class="panel mb"><div class="panel-header"><h3>Por revisar</h3><span class="pill coral">${review.length}</span></div>${review.map(t=>taskRow(t,w)).join('')}</div>`:''}<div class="section-title"><h2>Turnos semanales</h2>${isAdult()?btn('Gestionar misiones','task-tab-go','','secondary small','tasks'):''}</div><div class="template-grid">${state.templates.filter(t=>t.active!==false&&t.rotation).map(t=>`<div class="template-card"><div class="flex between"><h3>${esc(t.title)}</h3>${isAdult()?iconBtn('edit','task-form','Editar rotaci\u00f3n',vattr(t.id)):''}</div><p class="small muted mt">Rotaci\u00f3n por semana: ${t.memberIds.map(id=>esc(member(id).name)).join(' \u2192 ')}</p><div class="note mt">Esta semana: ${[...new Set(w.tasks.filter(x=>x.templateId===t.id).map(x=>member(x.memberId).name))].map(esc).join(', ')||'Sin ocurrencias'}</div></div>`).join('')||empty(esc(t('emptyOrganizeTitle')),esc(t('emptyOrganizeDetail')))}</div><div class="section-title"><h2>\u00bfMe cambias una tarea?</h2>${btn('Proponer cambio','v2-swap-form','','secondary small','swap')}</div><div class="panel">${swaps.length?swaps.slice().reverse().map(x=>{const sw=getWeek(x.week),a=sw.tasks.find(t=>t.id===x.taskA),b=sw.tasks.find(t=>t.id===x.taskB);return `<div class="swap-row"><div class="grow"><h4>${esc(member(x.from).name)} \u2194 ${esc(member(x.to).name)}</h4><p>${esc(a?.title||'Tarea archivada')} por ${esc(b?.title||'Tarea archivada')}</p><span class="pill ${x.status==='approved'?'green':'gray'}">${({pending:'Esperando a la otra persona',accepted:'Pendiente de adulto',approved:'Cambio confirmado',declined:'No realizado'})[x.status]}</span></div><div class="flex wrap">${x.status==='pending'&&(isAdult()||actor.memberId===x.to)?btn(isAdult()?'Aceptar por la otra persona':'Aceptar cambio','v2-swap-resolve',`${vattr(x.id)} data-decision="accept"`,'secondary small'):''}${x.status==='accepted'&&isAdult()?btn('Confirmar cambio','v2-swap-resolve',`${vattr(x.id)} data-decision="approve"`,'primary small'):''}${['pending','accepted'].includes(x.status)?iconBtn('close','v2-swap-resolve','No realizar cambio',`${vattr(x.id)} data-decision="decline"`):''}</div></div>`;}).join(''):empty(esc(t('emptySwapTitle')),esc(t('emptySwapDetail')))}</div>${isAdult()?`<div class="section-title"><h2>D\u00edas especiales y ausencias</h2></div><div class="panel">${state.absences.filter(x=>x.active).map(x=>`<div class="settings-row padded"><div class="grow"><h4>${esc(member(x.memberId).name)} &middot; ${esc(x.reason)}</h4><p>${esc(dateLabel(x.from))} - ${esc(dateLabel(x.to))}. Sin penalizaci\u00f3n en las tareas justificadas.</p></div>${btn('Anular','v2-absence-cancel',vattr(x.id),'secondary small')}</div>`).join('')||empty(esc(t('emptyPresenceTitle')),esc(t('emptyPresenceDetail')))}</div>`:''}`;}
function absenceForm(){if(!needAdult())return;openModal('Un d\u00eda diferente',`<label class="field"><span>Persona</span><select name="memberId">${activeMembers().map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><div class="form-grid">${field('Desde','from',C.iso(),'date',`required min="${C.monday()}"`)}${field('Hasta','to',C.iso(),'date','required')}</div><div class="mt">${field('Motivo','reason','','text','required maxlength="300" placeholder="Vacaciones, visita familiar..."')}</div><div class="note">Solo se justifican tareas normales pendientes o por revisar. No se cambian las tareas completadas ni las semanas cerradas. Los objetivos se recalculan.</div>${footer('Justificar tareas')}`,fd=>transact(s=>C.addAbsence(s,{memberId:fd.get('memberId'),from:fd.get('from'),to:fd.get('to'),reason:String(fd.get('reason')).trim()},actor),'Ausencia registrada.'));}
function swapForm(){const w=current(),tasks=w.tasks.filter(t=>t.status==='pending'&&t.kind==='normal'),mine=tasks.filter(t=>isAdult()||t.memberId===actor.memberId);if(!mine.length||tasks.length<2){toast('Se necesitan tareas pendientes de dos personas.');return;}const opts=xs=>xs.map(t=>`<option value="${esc(t.id)}">${esc(member(t.memberId).name)}: ${esc(t.title)} (${esc(dateLabel(t.date))})</option>`).join('');openModal('Proponer un intercambio',`<label class="field"><span>Mi tarea</span><select name="taskA">${opts(mine)}</select></label><label class="field"><span>La cambio por</span><select name="taskB">${opts(tasks)}</select></label><div class="note">Elige tareas de personas distintas. El cambio no se aplicar\u00e1 hasta que lo acepte la otra persona y lo confirme un adulto.</div>${footer('Enviar propuesta')}`,fd=>transact(s=>C.proposeSwap(s,w.id,fd.get('taskA'),fd.get('taskB'),actor),'Cambio propuesto.'));}
function renderVouchers(){const vs=state.vouchers.filter(v=>isAdult()||v.memberId===actor.memberId);return `<div class="section-title"><h2>Mi cartera de vales</h2><span class="small muted">Ganados para disfrutarlos, no para gastarlos dos veces.</span></div><div class="voucher-grid">${vs.slice().reverse().map(v=>`<article class="voucher-card ${v.status==='used'?'used':''}"><div class="voucher-top"><span>${esc(v.icon)}</span><span class="pill ${v.status==='used'?'gray':'green'}">${({earned:'Ganado',requested:'Fecha solicitada',scheduled:'En el calendario',used:'Disfrutado'})[v.status]}</span></div><h3>${esc(v.title)}</h3><p class="small muted">${esc(member(v.memberId).name)} &middot; semana del ${esc(dateLabel(v.week))}</p>${v.requestedDate?`<p class="small mt">${esc(dateLabel(v.requestedDate))}</p>`:''}<div class="voucher-footer">${['earned','requested'].includes(v.status)?btn('Elegir un d\u00eda','v2-voucher-request',vattr(v.id),'secondary small','calendar'):''}${isAdult()&&v.status==='requested'?btn('Confirmar fecha','v2-voucher-approve',vattr(v.id),'primary small'):''}${isAdult()&&v.status!=='used'?btn('Ya disfrutado','v2-voucher-use',vattr(v.id),'secondary small','check'):''}${v.status==='used'?'<span class="small muted">Guardado en vuestra historia.</span>':''}</div></article>`).join('')||empty(esc(t('emptyVouchersTitle')),esc(t('emptyVouchersDetail')))}</div>`;}
function legacy31RenderPrepCards(){const es=state.events.filter(e=>(e.endDate||e.date)>=C.iso()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);return `<div class="section-title"><h2>Prepararnos tambi\u00e9n es parte del plan.</h2></div><div class="prep-grid">${es.map(e=>{const p=state.preparations.find(p=>p.eventId===e.id),can=isAdult()||p?.memberId===actor.memberId;return `<div class="template-card"><div class="flex between"><h3>${esc(e.title)}</h3><span class="small muted">${esc(dateLabel(e.date))}</span></div>${p?`<p class="small muted mt">${esc(member(p.memberId).name)} &middot; ${p.items.filter(i=>i.done).length}/${p.items.length} listo</p><div class="mt">${p.items.map(i=>`<label class="check-label"><input type="checkbox" data-change="v2-prep-toggle" data-id="${p.id}" data-item="${i.id}" ${i.done?'checked':''} ${can?'':'disabled'}>${esc(i.title)}</label>`).join('')}</div>`:`<p class="small muted mt">Una lista para que no se nos olvide nada.</p><div class="mt">${isAdult()?btn('Preparar este plan','v2-prep-form',vattr(e.id),'secondary small','tasks'):'<span class="small muted">Un adulto puede preparar la lista.</span>'}</div>`}</div>`;}).join('')||empty(esc(t('emptyEventsTitle')),esc(t('emptyEventsDetail')))}</div>`;}
function legacy31PrepForm(id,preset='excursion'){if(!needAdult())return;const e=state.events.find(e=>e.id===id);if(!e)return;openModal('Preparar: '+esc(e.title),`<label class="field"><span>Plantilla</span><select data-change="v2-prep-preset"><option value="excursion">Excursi\u00f3n</option><option value="piscina">Piscina</option><option value="deporte">Deporte</option><option value="cumple">Cumplea\u00f1os</option></select></label><label class="field"><span>Qui\u00e9n se ocupa</span><select name="memberId">${activeMembers().map(m=>`<option value="${m.id}" ${m.id===e.memberId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label class="field"><span>Lista, una cosa por l\u00ednea</span><textarea name="items" required maxlength="4000">${esc(C.PREP_SETS[preset].join('\n'))}</textarea></label><div class="note">Se guardar\u00e1 como una lista del evento. No crea misiones, no da puntos y no modifica el objetivo semanal.</div>${footer('Aceptar y crear lista')}`,fd=>transact(s=>C.createPrep(s,id,fd.get('memberId'),String(fd.get('items')).split('\n').map(x=>x.trim()).filter(Boolean),actor),'Lista de preparaci\u00f3n creada.'));}

async function v2Action(a,d,el,event){
 if(a==='menu-shopping'){const plans=state.mealPlan.filter(p=>p.date>=ui.menuStart&&p.date<=C.addDays(ui.menuStart,6));if(!plans.length)toast('Primero a\u00f1ade un plato al men\u00fa.');else shoppingPreview(plans);return true;}

 if(!a.startsWith('v2-'))return false;
 const adultOnly=new Set(['v2-money-config','v2-money-add','v2-pay','v2-spend-approve','v2-spend-decline','v2-money-reverse','v2-routine-form','v2-routine-delete','v2-absence-form','v2-absence-cancel','v2-voucher-approve','v2-voucher-use','v2-prep-form','v2-pantry-form','v2-pantry-delete','v2-pantry-receive','v2-meal-cook','v2-meeting-close','v2-proposal-approve','v2-proposal-plan']);
 if(adultOnly.has(a)&&!needAdult())return true;
 switch(a){
 case 'v2-select-person':if(!isAdult())break;if(d.area==='money')ui.moneyMember=d.id;if(d.area==='routine')ui.routineMember=d.id;render();break;
 case 'v2-wallet-person':if(!isAdult()&&actor.memberId!==d.id)break;ui.moneyMember=d.id;ui.moneyTab='wallet';nav('money');break;
 case 'v2-money-tab':ui.moneyTab=['wallet','activity'].includes(d.tab)?d.tab:'wallet';render();break;
 case 'v2-money-config':moneyConfig(d.id);break;
 case 'v2-transfer':transferForm(d.id,d.to||'savings');break;
 case 'v2-spend':spendForm(d.id);break;
 case 'v2-goal-form':goalForm(d.id);break;
 case 'v2-goal-buy':{const g=state.finance.goals.find(g=>g.id===d.id);if(g)spendForm(g.memberId,g);break;}
 case 'v2-money-add':openModal('Registrar dinero recibido',`<div class="note mb">Confirma solo dinero que ya reconoce o ha recibido la familia para ${esc(member(d.id).name)}. Este registro no hace una transferencia bancaria.</div>${field('Importe (\u20ac)','amount','','number','required min="0.01" step="0.01"')}<label class="field"><span>D\u00f3nde lo guardamos</span><select name="pocket">${pocketOptions(d.id)}</select></label>${field('Concepto','note','','text','required maxlength="300" placeholder="Regalo de cumplea\u00f1os"')}${footer('Confirmar ingreso')}`,fd=>transact(s=>C.postMoney(s,d.id,{[fd.get('pocket')]:C.moneyCents(fd.get('amount'))},'deposit',String(fd.get('note')).trim(),null,actor),'Ingreso registrado.'));break;
 case 'v2-pay':{const pay=state.finance.dues.find(x=>x.id===d.id);if(!pay)break;const savings=Math.round(pay.cents*pay.savePercent/100);confirmDialog('Confirmar la paga semanal',`${esc(member(pay.memberId).name)} recibir\u00e1 <b>${euro(pay.cents)}</b> en el registro: ${euro(pay.cents-savings)} disponibles y ${euro(savings)} en la hucha. Confirma que ese dinero queda a su disposici\u00f3n bajo custodia familiar. No hay transferencia bancaria.`,()=>transact(s=>C.payAllowance(s,d.id,actor),'Paga registrada una sola vez.'),'Confirmar abono');break;}

function fromB64(str){return Uint8Array.from(atob(str),c=>c.charCodeAt(0));}

async function passwordKey(password,salt){
 if(!crypto?.subtle)throw new Error('Este navegador requiere HTTPS o localhost para crear cuentas. Usa el servidor incluido.');
 const input=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(salt),iterations:600000,hash:'SHA-256'},input,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);

function guideDraft(){
 if(ui.guide)return ui.guide;
 const adult=state.members.find(m=>m.role==='adult'&&m.active!==false);
 const given=String(adult?.name||'');
 ui.guide={step:0,familyName:state.settings.familyName||'',adultName:given==='Adulto'?'':given,people:[{name:'',role:'member',email:''}],pets:[{name:'',species:'perro'}]};

function readGuide(form){
 const g=guideDraft();if(!form)return g;
 if(form.elements.familyName)g.familyName=form.elements.familyName.value;
 if(form.elements.adultName)g.adultName=form.elements.adultName.value;
 const people=[...form.querySelectorAll('[data-guide-person]')].map(row=>({name:row.querySelector('[name=personName]').value,role:row.querySelector('[name=personRole]').value,email:(row.querySelector('[name=personEmail]')?.value||'').trim().toLowerCase()}));

function finishGuide(){
 const g=guideDraft(),family=g.familyName.trim(),adultName=g.adultName.trim();
 if(!family||!adultName)throw new Error(t5('guideNeedNames'));
 const petEmoji={perro:'\u{1F436}',gato:'\u{1F431}',otro:'\u{1F43E}'};
 const ok=transact(s=>{
  s.settings.familyName=family.slice(0,80);s.settings.familyReady=true;
  const adult=s.members.find(m=>m.role==='adult'&&m.active!==false);if(adult)adult.name=adultName.slice(0,80);
  let n=s.members.length;
  for(const p of g.people){const name=p.name.trim();if(!name)continue;const email=String(p.email||'').trim().toLowerCase();s.members.push({id:C.uid('member'),name:name.slice(0,80),role:p.role==='adult'?'adult':'member',avatar:p.role==='adult'?'\u{1F9D1}':'\u{1F9D2}',color:colors[n%colors.length],age:null,active:true,email:email||'',inviteStatus:'none'});n++;}
  for(const p of g.pets){const name=p.name.trim();if(!name)continue;const species=['perro','gato','otro'].includes(p.species)?p.species:'otro';s.members.push({id:C.uid('member'),name:name.slice(0,80),role:'pet',species,avatar:petEmoji[species],color:colors[n%colors.length],age:null,active:true});n++;}
  const w=s.weeks.find(w=>w.status==='open')||s.weeks.at(-1);
  if(w)for(const m of s.members){const shot=C.memberSnapshot(m),snap=w.members.find(x=>x.id===m.id);if(snap)Object.assign(snap,shot);else w.members.push(shot);}
 },t5('familyReady'));
 if(!ok)return;
 ui.guide=null;ui.view='home';ui.tour={step:0};render();
 if(access.mode==='cloud'&&typeof canManageInvites==='function'&&canManageInvites()){
  const pending=state.members.filter(m=>m.active!==false&&m.role!=='pet'&&m.email&&m.inviteStatus!=='joined'&&m.userId!==access.user?.id);
  if(pending.length){
   queueMicrotask(async()=>{
    try{
     for(const m of pending){
      const inv=await window.HomaCloudTransport.invite(m.email,m.id,m.role==='adult'?'adult':'child');
      transact(s=>{const x=s.members.find(y=>y.id===m.id);if(x)x.inviteStatus='pending';},null);
      showInviteResult(inv,m.name);
     }
    }catch(err){toast(err.message||'No se pudieron crear las invitaciones.',true);}
   });
  }
 }
}

 case 'web5-file-open':{if(!needAdult())return true;const f=state.eventFiles.find(f=>f.id===d.id);const blob=await window.HomaAssets.get(KEY,d.id);if(!blob)throw new Error('El archivo no est\u00e1 en este dispositivo. Restaura una copia completa.');const url=URL.createObjectURL(blob),ael=document.createElement('a');ael.href=url;ael.download=f.name;ael.click();setTimeout(()=>URL.revokeObjectURL(url),30000);return true;}
 case 'web5-file-delete':{if(!needAdult())return true;confirmDialog('Eliminar documento','Se eliminar\u00e1 el documento de este evento.',async()=>{const ok=transact(s=>s.eventFiles=s.eventFiles.filter(f=>f.id!==d.id));if(ok)await window.HomaAssets.remove(KEY,d.id);return ok;},'Eliminar');return true;}
 case 'backup-export':{if(!needAdult())return true;const bundle=await window.HomaAssets.exportBundle(KEY,state.eventFiles.map(f=>f.id));downloadFile('la-homa-copia-completa-'+C.iso()+'.json',JSON.stringify({...state,assetBundle:bundle},null,2),'application/json');toast('Copia completa creada, incluidos los adjuntos disponibles.');return true;}
 case 'web5-forgot':resetPassword5();return true;
 case 'guide-back':{const g=readGuide($('#family-guide'));g.step=Math.max(0,g.step-1);render();return true;}
 case 'guide-add':{const g=readGuide($('#family-guide'));if(d.kind==='pet')g.pets.push({name:'',species:'perro'});else g.people.push({name:'',role:'member',email:''});render();return true;}
 case 'guide-remove':{const g=readGuide($('#family-guide'));const list=d.kind==='pet'?g.pets:g.people;const i=Number(d.index);if(list.length<=1)list[0].name='';else list.splice(i,1);render();return true;}
 case 'web5-timezone':openModal('Zona horaria del hogar',`${field('Zona horaria IANA','zone',state.settings.timeZone,'text','required maxlength="80" placeholder="Europe/Madrid"')}<p class="note">Se guarda una sola zona para el hogar. El servidor la usar\u00e1 al activar la nube. Este prototipo a\u00fan usa el reloj del dispositivo para las operaciones locales.</p>${footer('Guardar')}`,fd=>transact(s=>{new Intl.DateTimeFormat('es',{timeZone:fd.get('zone')});s.settings.timeZone=fd.get('zone');},'Zona horaria guardada.'));return true;
 case 'web5-connections':openModal(esc(t5('howSavedTitle')),`<div class="connection-row"><b>${esc(t5('howSavedDevice'))}</b><span>${esc(t5('howSavedDeviceText'))}</span></div><div class="connection-row"><b>${esc(t5('howSavedAccount'))}</b><span>${esc(cloudConfigured()?(access.mode==='cloud'?t5('howSavedCloudOn'):t5('howSavedCloudReady')):t5('howSavedCloudOff'))}</span></div><div class="connection-row"><b>${esc(t5('howSavedCal'))}</b><span>${esc(t5('howSavedCalText'))}</span></div><div class="connection-row"><b>${esc(t5('howSavedPush'))}</b><span>${esc(t5('howSavedPushText'))}</span></div><p class="note mt">${esc(t5('howSavedBackupNote'))}</p><div class="modal-footer">${btn(esc(t5('understood')),'close','','primary')}</div>`);return true;
 }
 return false;
}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.change==='member-role'){const pet=el.value==='pet';$('#member-age')?.classList.toggle('hidden',pet);$('#member-species')?.classList.toggle('hidden',!pet);$('#member-email')?.classList.toggle('hidden',pet);}if(el.dataset.change==='web5-list'){web5.shoppingList=el.value;render();}if(el.dataset.change==='web5-diet'){web5.diet=el.value;render();}if(el.dataset.change==='app-locale'&&window.HomaI18n){const code=window.HomaI18n.normalize(el.value);window.HomaI18n.setLocale(code);if(state?.settings){const apply=()=>{state.settings.locale=code;if(typeof queueAccountSave==='function')queueAccountSave(C.copy(state));else if(typeof save==='function')save();};if(typeof transact==='function'&&!access.blocked)transact(s=>{s.settings.locale=code;},'');else apply();}render();}});
document.addEventListener('submit',e=>{if(e.target.id!=='family-guide')return;e.preventDefault();const g=readGuide(e.target);if(g.step===0&&(!g.familyName.trim()||!g.adultName.trim())){toast(t5('guideNeedNames'),true);return;}if(g.step<2){g.step++;render();return;}try{finishGuide();}catch(err){toast(err.message,true);}});
window.addEventListener('beforeunload',e=>{if($('#modal')?.open&&modalSubmit&&web5.modalInitial&&modalSnapshot5()!==web5.modalInitial){e.preventDefault();e.returnValue='';}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});

document.addEventListener('change',e=>{if(e.target.dataset.change==='task-frequency'&&['flexible','monthly'].includes(e.target.value)){document.querySelectorAll('#modal [name=days]').forEach(x=>x.checked=true);const hint=document.querySelector('#frequency-hint');if(hint)hint.textContent=e.target.value==='flexible'?'Hasta la cuota elegida, en días distintos en casa. Se limita a tus días disponibles.':'Una vez al mes, desde el día elegido, en el primer día de convivencia.';}});

async function cloudFunction5(name,payload){const client=await cloudClient();const {data,error}=await client.functions.invoke(name,{body:payload});if(error)throw new Error('El servicio web no ha podido completar la solicitud. Revisa su despliegue y permisos.');return data;}

bootAccess();
})();

</script>
